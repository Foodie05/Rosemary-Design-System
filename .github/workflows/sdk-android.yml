name: SDK Android
on:
  push:
    paths: ['platforms/android/**', 'design/**', '.github/workflows/sdk-android.yml']
  pull_request:
    paths: ['platforms/android/**', 'design/**', '.github/workflows/sdk-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    env:
      ROSEMARY_BUILD_ROOT: ${{ github.workspace }}/.sdk-build
      ROSEMARY_ARTIFACT_ROOT: ${{ github.workspace }}/.sdk-artifacts
      GRADLE_USER_HOME: ${{ github.workspace }}/.sdk-cache/gradle
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Android build SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0' 'platform-tools'
      - name: Publish AAR and verify library
        run: platforms/android/scripts/verify.sh library
      - name: Build real Maven consumer APK
        run: platforms/android/scripts/verify.sh consumer
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: API ${{ matrix.api }} interactions
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: ${{ matrix.api == 26 }}
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: platforms/android/scripts/verify.sh device
      - name: AAR, Maven ZIP, APK and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rosemary-compose-0.4.0-api${{ matrix.api }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .sdk-artifacts/android/
            .sdk-build/android/rosemary-compose/outputs/aar/
            .sdk-build/android/rosemary-compose/reports/
            .sdk-build/android/rosemary-compose/test-results/
            .sdk-build/android/rosemary-compose/outputs/androidTest-results/
            .sdk-build/android/sample/reports/
            .sdk-build/android/sample/outputs/androidTest-results/
