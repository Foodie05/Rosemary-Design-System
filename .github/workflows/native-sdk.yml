name: Native SDK engineering
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          cache: true
      - run: npm ci
      - run: npm run tokens:check
      - run: node --import tsx scripts/check-native-coverage.mts
      - working-directory: platforms/flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - working-directory: platforms/flutter/example
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build ios --simulator --no-codesign
  swiftui:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: swift test --package-path platforms/swiftui
      - run: brew install xcodegen
      - working-directory: platforms/swiftui/Sample
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -project RosemarySample.xcodeproj -scheme RosemarySample -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Run UI tests on an available iPhone simulator
        working-directory: platforms/swiftui/Sample
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,devices in d["devices"].items() if ".iOS-" in runtime for x in devices if x["name"].startswith("iPhone")))')
          xcodebuild -project RosemarySample.xcodeproj -scheme RosemarySample -destination "id=$device" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO test
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - working-directory: platforms/android
        run: ./gradlew :rosemary-compose:testDebugUnitTest :rosemary-compose:assembleDebug :sample:assembleDebug
      - name: Enable KVM for the test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: cd platforms/android && ./gradlew :rosemary-compose:connectedDebugAndroidTest :sample:connectedDebugAndroidTest
