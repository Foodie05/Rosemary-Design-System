name: Flutter SDK
on:
  push:
    branches: [main]
    paths: ['platforms/flutter/**', 'design/**', '.github/workflows/sdk-flutter.yml']
  pull_request:
    paths: ['platforms/flutter/**', 'design/**', '.github/workflows/sdk-flutter.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-flutter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  consumer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-web-android
          - os: macos-15
            target: macos-ios
          - os: windows-2022
            target: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      ROSEMARY_BUILD_ROOT: ${{ github.workspace }}/.sdk-build
      ROSEMARY_ARTIFACT_ROOT: ${{ github.workspace }}/.sdk-artifacts
      PUB_CACHE: ${{ github.workspace }}/.sdk-cache/pub
      GRADLE_USER_HOME: ${{ github.workspace }}/.sdk-cache/gradle
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        if: runner.os == 'Linux'
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        if: runner.os == 'macOS'
        with:
          xcode-version: '26.3'
      - name: Linux and Android build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev xvfb
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Analyze and test actual archived package consumer
        run: python3 platforms/flutter/scripts/verify.py test
      - name: Linux, Web and installable Android consumer
        if: runner.os == 'Linux'
        run: |
          python3 platforms/flutter/scripts/verify.py linux
          python3 platforms/flutter/scripts/verify.py web
          python3 platforms/flutter/scripts/verify.py android
      - name: macOS and iOS simulator consumer
        if: runner.os == 'macOS'
        run: |
          python3 platforms/flutter/scripts/verify.py macos
          python3 platforms/flutter/scripts/verify.py ios
      - name: Windows consumer
        if: runner.os == 'Windows'
        run: python3 platforms/flutter/scripts/verify.py windows
      - name: Native desktop representative interactions from archive consumer
        if: runner.os != 'Linux'
        env:
          ROSEMARY_FLUTTER_DEVICE: ${{ runner.os == 'macOS' && 'macos' || 'windows' }}
          ROSEMARY_DEVICE_EVIDENCE_KEY: device-${{ runner.os }}
        run: python3 platforms/flutter/scripts/verify.py device
      - name: Linux native representative interactions from archive consumer
        if: runner.os == 'Linux'
        env:
          ROSEMARY_FLUTTER_DEVICE: linux
          ROSEMARY_DEVICE_EVIDENCE_KEY: device-linux
        run: xvfb-run -a python3 platforms/flutter/scripts/verify.py device
      - name: Enable KVM
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Installed Android native interactions, animations enabled
        if: runner.os == 'Linux'
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: python3 platforms/flutter/scripts/verify.py device
      - name: Source archive, six-target consumer and verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rosemary-flutter-0.4.1-${{ matrix.target }}
          include-hidden-files: true
          if-no-files-found: error
          path: .sdk-artifacts/flutter/
