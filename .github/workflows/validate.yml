name: Validate design system

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build offline portal and resources
        run: python3 -I build.py
      - name: Validate pages, assets, specifications, and contrast
        run: node tests/static-check.mjs
      - name: Confirm committed generated files are current
        run: git diff --exit-code -- tokens.css assets-data.js rosemary-design-portal.html 'rosemary-icons-*.zip' rosemary-icons-sprite.svg
