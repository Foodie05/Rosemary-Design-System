name: SwiftUI SDK
on:
  push:
    branches: [main]
    paths: ['Package.swift', 'platforms/swiftui/**', 'design/**', '.github/workflows/sdk-swiftui.yml']
  pull_request:
    paths: ['Package.swift', 'platforms/swiftui/**', 'design/**', '.github/workflows/sdk-swiftui.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-swiftui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.3'
      - name: Install project generator
        run: |
          curl --fail --location --retry 3 https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-tool"
          echo "$RUNNER_TEMP/xcodegen-tool/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Build and test root-package consumer
        env:
          ROSEMARY_BUILD_ROOT: ${{ runner.temp }}/rosemary-build
          ROSEMARY_ARTIFACT_ROOT: ${{ runner.temp }}/rosemary-artifacts
        run: platforms/swiftui/scripts/verify.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rosemary-swiftui-0.4.2
          path: ${{ runner.temp }}/rosemary-artifacts/ios
          if-no-files-found: warn
